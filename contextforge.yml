# Reference configuration, pointing at the sample app in this directory.
# The schema is specified in pipeline/docs/DESIGN.md section 2.
#
# Paths resolve against the directory holding this file, not the working
# directory, so the config means the same thing wherever it is run from.

version: 1

app:
  compose_file: sample-rag-app/docker-compose.eval.yml
  service: rag-app
  port: 18000
  health_path: /health
  query_path: /query
  startup_timeout: 120
  # Compose sees only these variables. PROVIDER lets the sample app run
  # offline (PROVIDER=local) for checks that need no model.
  env_passthrough:
    - PROVIDER
    - OPENAI_API_KEY
    - GEMINI_API_KEY
    - OPENAI_BASE_URL
    - GEMINI_EMBEDDING_BASE_URL
    - GENERATION_MODEL
    - EMBEDDING_MODEL
    - REASONING_EFFORT
    - TOP_K

dataset:
  # Compact, representative set for low-cost PR smoke checks. Use the full
  # testcases.json suite before release-quality evaluation.
  path: benchmark/testcases.smoke.json
  source_docs: sample-rag-app/docs/knowledge-base
  size: 10

evaluation:
  metrics: [context_precision, context_recall, faithfulness, answer_relevancy]
  judge:
    provider: openai
    # OpenRouter keeps high-volume Ragas scoring independent from Groq's
    # answer-generation quota. GPT-4.1 Mini supports structured output.
    model: openai/gpt-4.1-mini
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    temperature: 0
    seed: 42
  embeddings:
    provider: gemini
    model: gemini-embedding-001
    api_key_env: GEMINI_API_KEY
  runs: 1
  # Ragas expands a metric into multiple judge calls. Keep the smoke suite
  # serial so the OpenRouter judge stays within its in-flight budget.
  concurrency: 1

thresholds:
  mean_drop:
    context_precision: 0.05
    context_recall: 0.05
    faithfulness: 0.05
    answer_relevancy: 0.05
  absolute_floor:
    faithfulness: 0.70
  max_regressed_cases: 3
